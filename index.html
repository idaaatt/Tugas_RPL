<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Form Register -->
    <form id="registerForm" class="form active">
      <h2>Register</h2>
      <div class="form-group">
        <i class="fas fa-user"></i>
        <input type="text" id="nama" placeholder="Nama Lengkap" required />
      </div>
      <div class="form-group">
        <i class="fas fa-calendar-alt"></i>
        <input type="number" id="umur" placeholder="Umur" min="1" required />
      </div>
      <div class="form-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email" required />
      </div>
      <div class="form-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <div class="form-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" required />
      </div>
      <button type="submit">Daftar</button>
      <p class="toggle">Sudah punya akun? <a href="#" id="showLogin">Login di sini</a></p>
    </form>

    <!-- Form Login -->
    <form id="loginForm" class="form">
      <h2>Login</h2>
      <div class="form-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="loginEmail" placeholder="Email" required />
      </div>
      <div class="form-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Password" required />
      </div>
      <button type="submit">Masuk</button>
      <p class="toggle">Belum punya akun? <a href="#" id="showRegister">Daftar di sini</a></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
